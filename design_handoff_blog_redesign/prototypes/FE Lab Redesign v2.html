<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));

    function App() {
      return (
        <DesignCanvas

          subtitle="한상욱 · 따뜻한 저널 + 위키 밀도 · 선택된 변형 모음"

          <DCSection id="home" title="01 · Home" subtitle="에디토리얼 피처 — 그냥, 적어 두는 공부방.">
            <DCArtboard id="home-b" label="Home — 에디토리얼 피처" width={1200} height={1480}>
              <HomeB />
            </DCArtboard>
          </DCSection>

          <DCSection id="list" title="02 · Posts (Archive)" subtitle="사이드바 필터 · 리스트↔카드 토글 · 정렬 · 인라인 검색.">
            <DCArtboard id="list-a" label="Posts — 사이드바 필터 + 토글" width={1200} height={1300}>
              <ListA />
            </DCArtboard>
          </DCSection>

          <DCSection id="post" title="03 · Post detail" subtitle="우측 TOC + 진행률 바 + 각주.">
            <DCArtboard id="post-a" label="Post — TOC + 진행률 + 각주" width={1200} height={900}>

              <Analytics />
            </DCArtboard>
          </DCSection>

          <DCSection id="ideas" title="05 · 새 기능 제안" subtitle="컨셉 카드 — 어느 게 흥미로운지 골라 주세요.">

    root.render(<App />);
