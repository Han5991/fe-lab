name: Quality checks
description: >-
  lint · type check · test · 포스트 frontmatter · 포맷 · (선택) 블로그 빌드 + 산출물 SEO 검사.
  PR CI와 배포 워크플로가 **같은 정의**를 쓰도록 한곳에 모읍니다.

# 재사용 워크플로(workflow_call)가 아니라 composite action인 이유:
# workflow_call로 빼면 체크 이름이 `<호출 잡 id> / <잡 이름>`으로 바뀝니다.
# ci.yml의 `Lint / Types / Tests`는 브랜치 보호의 required check로 걸려 있어,
# 이름이 바뀌면 PR이 "Expected — waiting for status"에서 멈춥니다.
# composite action은 스텝 단위라 잡 이름·체크 이름이 그대로입니다.
#
# 호출 전제: 저장소가 checkout되어 있고 pnpm/Node 설치와 `pnpm install`이 끝나 있어야 합니다.

inputs:
  build-blog:
    description: >-
      블로그를 빌드해 산출물 검사(check-seo·check-bundle)까지 돌릴지 여부.
      배포 워크플로는 뒤에 자체 빌드 스텝(--no-cache + Pages base path + 시크릿)이
      있으므로 'false'로 넘겨 중복 빌드를 피합니다.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # lint/check-types/test는 모두 turbo 태스크. 한 번의 turbo 호출로 묶으면
    # 공유 의존성(^build)을 한 번만 빌드하고 세 태스크를 의존성 그래프에 맞춰
    # 병렬 실행 + 캐싱합니다. (태스크별로 따로 호출하면 ^build가 중복됩니다)
    - name: Lint / Type check / Test
      shell: bash
      run: pnpm turbo run lint check-types test

    # turbo 태스크가 아닌 검사들 (가볍게 끝나므로 순차 실행)
    - name: Lint blog posts (frontmatter)
      shell: bash
      run: pnpm --filter @blog/web lint:posts

    - name: Format check
      shell: bash
      run: pnpm format:check

    # 블로그를 실제로 빌드해 산출물 검사(check-seo·check-bundle)까지 돌린다.
    # `build` 스크립트가 prebuild → next build → check-seo → check-bundle을 이어서 실행한다.
    #
    # lint:posts(위)는 frontmatter 원문만 본다. h1 개수·description 중복·
    # canonical·og 태그처럼 **렌더된 HTML에서만 보이는** 계약은 여기서만 잡힌다.
    - name: Build blog + artifact checks
      if: inputs.build-blog == 'true'
      shell: bash
      run: pnpm build --filter=@blog/web
