name: Quality checks
description: >-
  lint · type check · test · 포스트 frontmatter · (선택) 포맷 · (선택) 블로그 빌드 + 산출물 SEO 검사
  + 런타임 e2e.
  PR CI와 배포 워크플로가 **같은 정의**를 쓰도록 한곳에 모읍니다.

# 재사용 워크플로(workflow_call)가 아니라 composite action인 이유:
# workflow_call로 빼면 체크 이름이 `<호출 잡 id> / <잡 이름>`으로 바뀝니다.
# ci.yml의 `Lint / Types / Tests`는 브랜치 보호의 required check로 걸려 있어,
# 이름이 바뀌면 PR이 "Expected — waiting for status"에서 멈춥니다.
# composite action은 스텝 단위라 잡 이름·체크 이름이 그대로입니다.
#
# 호출 전제: 저장소가 checkout되어 있고 pnpm/Node 설치와 `pnpm install`이 끝나 있어야 합니다.

inputs:
  scope:
    description: >-
      lint·check-types·test를 어디까지 돌릴지. 'all'(기본)은 모노레포 전체, 'blog'는
      블로그와 그 의존성 폐포(@blog/web... — @blog/content·@blog/styled-system·@design-system/ui·ui-lib)만.
      배포 워크플로는 'blog'를 넘긴다. 매일 예약 글을 공개하는 무인 cron이 실험 앱
      (apps/react 등)의 flaky 테스트에 막히면 안 되기 때문이다 — d388db3(#446)에 매
      실행 절반쯤 깨지던 apps/react 테스트 기록이 있다. PR CI(ci.yml)는 'all'로 전부 본다.
    required: false
    default: 'all'
  build-blog:
    description: >-
      블로그를 빌드해 산출물 검사(check-seo·check-bundle)와 런타임 e2e까지 돌릴지 여부.
      배포 워크플로는 뒤에 자체 빌드 스텝(--force + NEXT_PUBLIC_PR_COUNT 주입)이
      있으므로 'false'로 넘겨 중복 빌드를 피합니다 — 런타임 e2e는 그 빌드 뒤에서
      같은 액션(.github/actions/blog-e2e)을 직접 부릅니다.
    required: false
    default: 'true'
  format:
    description: >-
      포맷 검사(prettier)를 돌릴지 여부. 배포는 'false'를 넘긴다 — 공백만 어긋난 파일이
      예약 글 공개를 막을 이유가 없고, 포맷은 PR CI와 pre-commit이 이미 본다.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # lint/check-types/test는 모두 turbo 태스크. 한 번의 turbo 호출로 묶으면
    # 공유 의존성(^build)을 한 번만 빌드하고 세 태스크를 의존성 그래프에 맞춰
    # 병렬 실행 + 캐싱합니다. (태스크별로 따로 호출하면 ^build가 중복됩니다)
    #
    # 입력값은 env로 받아 셸에 직접 끼워 넣지 않는다.
    - name: Lint / Type check / Test
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        case "$SCOPE" in
          all) pnpm turbo run lint check-types test ;;
          blog) pnpm turbo run lint check-types test --filter=@blog/web... ;;
          *)
            echo "::error::quality-checks의 scope는 all 또는 blog여야 합니다: $SCOPE"
            exit 1
            ;;
        esac

    # turbo 태스크가 아닌 검사들 (가볍게 끝나므로 순차 실행)
    - name: Lint blog posts (frontmatter)
      shell: bash
      run: pnpm --filter @blog/web lint:posts

    - name: Format check
      if: inputs.format == 'true'
      shell: bash
      run: pnpm format:check

    # 블로그를 실제로 빌드해 산출물 검사(check-seo·check-bundle)까지 돌린다.
    # `build` 스크립트가 prebuild → next build → check-seo → check-bundle을 이어서 실행한다.
    #
    # lint:posts(위)는 frontmatter 원문만 본다. h1 개수·description 중복·
    # canonical·og 태그처럼 **렌더된 HTML에서만 보이는** 계약은 여기서만 잡힌다.
    - name: Build blog + artifact checks
      if: inputs.build-blog == 'true'
      shell: bash
      run: pnpm build --filter=@blog/web

    # JS가 실행된 뒤의 블로그(hydration 뒤 본문·콘솔 에러·axe·/admin) — 위 스텝들은 전부
    # JS 실행 전의 산출물만 본다(#392: 클라이언트 컴포넌트가 본문을 지웠는데 모든 게이트 통과).
    # 정의는 blog-e2e 액션 하나에 있고, 배포 워크플로도 자기 빌드 뒤에서 같은 것을 부른다.
    - name: Runtime e2e
      if: inputs.build-blog == 'true'
      uses: ./.github/actions/blog-e2e
      with:
        reuse-pass: 'true'
