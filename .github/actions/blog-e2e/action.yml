name: Blog runtime e2e
description: >-
  빌드된 블로그(apps/blog/web/out)를 프로덕션과 같은 정적 Worker(wrangler dev)로 띄우고
  Playwright로 JS가 실행된 뒤를 검사합니다 — hydration 뒤 본문 보존, 콘솔 에러·예외 0,
  axe(WCAG A·AA), 모바일 넘침, 웹 폰트, JS 전용 상호작용, /admin.

# 호출 전제: `pnpm install`이 끝났고 같은 잡에서 블로그 빌드가 out/을 만들어 두었어야 한다.
# 이 액션은 빌드하지 않는다 — PR CI(quality-checks)와 배포(deploy-blog.yml의 빌드 잡)가
# 각자 빌드한 바로 그 out/을 본다. turbo 태스크로 두지 않은 것도 같은 이유다: build가
# 빌드 시각(BLOG_CONTENT_NOW)과 주입 env에 달려 있어, dependsOn으로 엮으면 다시 빌드하거나
# 다른 시점의 캐시를 재생한다.
#
# 같은 내용이 이미 통과했으면 건너뛸 수 있다(reuse-pass) — 다시 돌려도 같은 out/을 같은 스위트로
# 보는 것뿐이다. Next의 buildId가 빌드마다 달라 out/이 같으려면 turbo가 빌드를 재생했어야 하므로,
# 실제로 건너뛰는 건 블로그 빌드 입력을 건드리지 않은 PR이다.
#
# 시크릿이 없는 잡에서만 부른다. 브라우저 설치는 스크립트를 돌리는 install이라
# CLOUDFLARE_API_TOKEN을 쥔 잡(deploy·preview)에는 절대 넣지 않는다.

inputs:
  retries:
    description: >-
      실패한 테스트의 재시도 횟수(E2E_RETRIES). PR CI는 0 — 흔들림이 드러나야 한다(페이지는 표본만). 무인
      배포만 1을 넘겨, 한 번의 흔들림이 그날 예약 글 공개를 막지 않게 한다(재시도로
      통과한 테스트는 리포트에 flaky로 남는다).
    required: false
    default: '0'
  reuse-pass:
    description: >-
      'true'면 같은 입력(out/ + 아래 해시 목록)이 전에 통과한 기록이 있을 때 건너뛴다. PR CI만
      켠다 — 배포는 --force 빌드라 어차피 맞을 일이 없고, 공개 직전에는 매번 브라우저로 연다.
    required: false
    default: 'false'
  sample-pages:
    description: >-
      'true'면 페이지 검사(pages.spec)를 대표 페이지만 돈다(E2E_SAMPLE). PR CI만 켠다 — 전
      페이지는 배포가 공개 직전에 본다. 대표 페이지는 산출물에서 고른다(e2e/support/site.ts).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # e2e가 읽는 것 전부: 산출물, 스위트, 원고(공개 글 하한), 서버 설정, 도구 버전(lockfile·Node),
    # 이 액션과 이 액션을 reuse-pass로 부르는 쪽(입력·env를 정한다). 경로까지 해시하므로 이름만
    # 바뀌어도 다시 돈다.
    - name: Hash e2e inputs
      id: e2e-inputs
      if: inputs.reuse-pass == 'true'
      shell: bash
      run: |
        hash=$(find apps/blog/web/out apps/blog/web/e2e apps/blog/posts apps/blog/web/wrangler.jsonc \
            apps/blog/web/package.json pnpm-lock.yaml .tool-versions .github/actions/blog-e2e \
            .github/actions/quality-checks .github/workflows/ci.yml -type f -print0 \
          | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Look up a previous pass
      id: pass
      if: inputs.reuse-pass == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/blog-e2e-pass
        key: blog-e2e-pass-${{ steps.e2e-inputs.outputs.hash }}
        lookup-only: true

    # 브라우저 리비전은 Playwright 버전에 묶인다 — 캐시 키를 lockfile이 고정한 버전으로 잡는다.
    - name: Resolve Playwright version
      id: pw
      if: steps.pass.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/blog/web
      run: |
        echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        echo "image-os=$ImageOS" >> "$GITHUB_OUTPUT"

    # 복원과 저장을 나눈다 — 통짜 actions/cache는 잡이 성공해야 저장하므로, 캐시가 빈
    # 날 e2e가 실패하면(다시 돌리는 바로 그때) 받은 브라우저를 버리고 또 받는다.
    - name: Restore Playwright browsers
      id: pw-cache
      if: steps.pass.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell

    # OS 의존 패키지(apt)는 브라우저 캐시와 상관없이 러너마다 새로 깐다 — 아래 두 설치 경로
    # (install --with-deps, install-deps)가 모두 apt로 폰트·라이브러리 ~26MB를 받는다. 미러가
    # 끊기면 이 한 스텝이 10분씩 걸렸다(2026-10-22 PR #555의 두 런, 31~48kB/s — 같은 스텝이 다른
    # 런에서는 12초). 받은 .deb를 캐시하고 apt가 그 폴더를 아카이브로 쓰게 해, 버전이 맞는 패키지는
    # 미러에서 받지 않는다.
    # 키에 러너 이미지 버전을 넣지 않는다 — 같은 시각에도 러너마다 이미지가 달라(#557에서 연속한 두
    # 런이 서로 다른 ImageVersion) 거의 맞지 않았다. 접두(OS·Playwright 버전)로 가장 최근 것을 받고,
    # 새로 받은 패키지가 있을 때만 런마다 새 키로 저장한다. 옛 버전은 저장 전에 autoclean이 지운다.
    # 재평가: 2027-04-22 — 그때까지 이 캐시가 맞은 런에서도 install-deps가 분 단위로 걸린 적이
    # 있으면(효과 없음) 컨테이너 이미지로 옮기는 쪽을 다시 본다.
    - name: Restore Chromium OS packages
      if: steps.pass.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/tmp/playwright-apt/*.deb
        key: playwright-apt-${{ runner.os }}-${{ steps.pw.outputs.image-os }}-${{ steps.pw.outputs.version }}-${{ github.run_id }}
        restore-keys: playwright-apt-${{ runner.os }}-${{ steps.pw.outputs.image-os }}-${{ steps.pw.outputs.version }}-

    # apt-get은 받은 패키지를 아카이브 폴더에 남기고, 거기 같은 버전이 있으면 받지 않는다. 폴더를
    # 러너 홈($RUNNER_TEMP) 밖에 두는 이유: apt는 받는 동안 _apt 사용자로 내려가는데 그 사용자는
    # 러너 홈에 들어가지 못해 root로 받으며 경고했다(#557 첫 런).
    - name: Point apt at the package cache
      id: apt-dir
      if: steps.pass.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dir=/var/tmp/playwright-apt
        sudo mkdir -p "$dir/partial"
        sudo chown _apt "$dir/partial"
        printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$dir" \
          | sudo tee /etc/apt/apt.conf.d/99playwright-apt-cache >/dev/null
        echo "before=$(find "$dir" -maxdepth 1 -name '*.deb' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # 헤드리스는 chromium-headless-shell만 쓴다(--only-shell) — 전체 Chromium보다 작다.
    # 캐시가 맞아도 OS 의존 패키지(apt)는 러너마다 새로 깔아야 한다(받는 것은 위 apt 캐시가 줄인다).
    - name: Install Chromium
      if: steps.pass.outputs.cache-hit != 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/blog/web
      run: pnpm exec playwright install --with-deps --only-shell chromium

    - name: Save Playwright browsers
      if: steps.pass.outputs.cache-hit != 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.pw-cache.outputs.cache-primary-key }}

    - name: Install Chromium OS dependencies
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: apps/blog/web
      run: pnpm exec playwright install-deps chromium

    # e2e보다 먼저 저장한다 — 브라우저 캐시와 같은 이유(실패해서 다시 돌리는 런이 또 받지 않게).
    # 지금 색인에 없는 옛 버전은 지우고(autoclean), 폴더가 복원한 그대로면 저장하지 않는다.
    - name: Check for new OS packages
      id: apt-debs
      if: steps.pass.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dir=/var/tmp/playwright-apt
        sudo apt-get autoclean -qq
        after=$(find "$dir" -maxdepth 1 -name '*.deb' | sort | sha256sum | cut -d' ' -f1)
        count=$(find "$dir" -maxdepth 1 -name '*.deb' | wc -l)
        echo "changed=$([ "$after" != "${{ steps.apt-dir.outputs.before }}" ] && [ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Save Chromium OS packages
      if: steps.apt-debs.outputs.changed == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/tmp/playwright-apt/*.deb
        key: playwright-apt-${{ runner.os }}-${{ steps.pw.outputs.image-os }}-${{ steps.pw.outputs.version }}-${{ github.run_id }}

    - name: Runtime e2e
      if: steps.pass.outputs.cache-hit != 'true'
      shell: bash
      env:
        E2E_RETRIES: ${{ inputs.retries }}
        E2E_SAMPLE: ${{ inputs.sample-pages == 'true' && '1' || '' }}
      run: |
        pnpm --filter @blog/web test:e2e
        touch "$RUNNER_TEMP/blog-e2e-pass"

    # 내용은 빈 파일이고 키가 기록이다.
    - name: Record the pass
      if: inputs.reuse-pass == 'true' && steps.pass.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/blog-e2e-pass
        key: ${{ steps.pass.outputs.cache-primary-key }}

    # 실패했을 때만 — HTML 리포트에 트레이스·스크린샷·axe 위반 목록이 들어 있다.
    - name: Upload e2e report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blog-e2e-report
        path: apps/blog/web/.playwright/
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 7
