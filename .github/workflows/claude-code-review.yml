name: Claude Code Review

on:
  pull_request:
    types: [ opened, synchronize ]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # 봇이 연 PR은 원칙적으로 리뷰하지 않되, major 업데이트만 예외로 받는다.
    #
    # claude-code-action은 non-human actor를 거부한다
    # ("Workflow initiated by non-human actor: renovate (type: Bot)").
    # 그대로 두면 의존성 PR마다 실패한 체크가 붙는다.
    #
    # minor/patch의 판정 기준은 "코드 품질"이 아니라 "올려도 안 깨지나"이고
    # 그건 CI가 본다 — diff도 대부분 lockfile이라 리뷰할 코드가 없다.
    # 반면 major는 release note를 이 저장소 코드와 대조할 가치가 있으므로,
    # renovate.json이 붙이는 deps-major 라벨을 보고 리뷰를 돌린다.
    if: >-
      github.event.pull_request.user.type != 'Bot' ||
      contains(github.event.pull_request.labels.*.name, 'deps-major')

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # mcp__github_ci__* 서버는 설치 전에 워크플로 토큰의 actions:read를 실제로
      # 검증한다. 없으면 경고만 남기고 서버를 조용히 빼므로 여기서 함께 켠다.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 위 if의 deps-major 예외를 실제로 동작하게 만드는 설정.
          # 액션은 actor의 type이 User가 아니면 allowed_bots에 있는지부터 보고,
          # 없으면 "Workflow initiated by non-human actor" 로 그 자리에서 죽는다.
          # 즉 지금까지 deps-major PR은 if는 통과하고 액션에서 실패했다.
          # 이름은 소문자화 + `[bot]` 접미사 제거 후 비교하므로 renovate만 써도 되지만,
          # PR에 표시되는 이름 그대로 두는 편이 대조하기 쉽다.
          # '*'는 쓰지 않는다 — 아무 App이나 이 워크플로를 돌릴 수 있게 된다.
          allowed_bots: 'renovate[bot]'

          # CI 결과(mcp__github_ci__*)를 읽기 위해 필요. 리뷰가 "빨간 체크가 왜
          # 빨간지"까지 보고 판단할 수 있게 된다.
          additional_permissions: |
            actions: read

          # 인라인 코멘트를 발견 즉시 던지지 않고 버퍼에 모아 분류한 뒤 게시한다.
          # 기본값이 true라 없어도 동작은 같지만, 이 워크플로가 인라인 코멘트를
          # 쓰기 시작했으므로 의존하는 동작을 명시해 둔다.
          classify_inline_comments: true

          # 인라인 지적에 "Fix this" 링크를 붙인다. 작성자가 링크만 눌러도
          # 그 지적에 대한 후속 수정 작업이 걸린다. (기본값 true, 명시)
          include_fix_links: true

          # 실행 리포트를 Actions Step Summary에 남긴다. 리뷰가 왜 짧게 끝났는지
          # /어디서 막혔는지를 raw 로그를 뒤지지 않고 확인하기 위한 것.
          display_report: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}

            당신은 이 저장소의 리뷰어입니다. 프론트엔드 코드와 블로그 글을 모두 봅니다.
            먼저 `gh pr view`로 PR 설명을, `gh pr diff --name-only`로 변경된 파일 목록을
            확인한 뒤 모드를 결정하세요.
            체크아웃은 shallow(fetch-depth: 1)이므로 로컬 git 히스토리에 의존하지 말고
            diff는 반드시 `gh pr diff`로 가져오세요.
            저장소 파일은 Read/Grep/Glob으로 직접 읽어 변경의 실제 사용처와
            기존 문서의 컨벤션을 확인하세요.

            <ci_results>
            리뷰를 쓰기 전에 `mcp__github_ci__get_ci_status`로 이 PR의 CI 상태를
            확인하세요. 실패한 잡이 있으면 `mcp__github_ci__get_workflow_run_details`
            와 `mcp__github_ci__download_job_log`로 로그를 받아 실패 원인이 이번
            diff에 있는지 판단하세요.

            - 원인이 diff에 있으면 파일:라인과 함께 지적으로 올리세요.
              CI가 이미 빨갛다는 사실만 반복하지 말고, 어느 줄이 왜 그 실패를
              만들었는지를 쓰세요.
            - 원인이 diff 밖(플래키 테스트, 인프라, base 브랜치 선행 실패)이면
              지적 대신 요약에 한 줄로만 적으세요.
            - CI가 아직 실행 중이면 기다리지 말고 그대로 리뷰하되, 요약에
              "CI 진행 중"이라고 적으세요.

            CI가 전부 통과했다는 것은 "테스트가 커버하는 범위에서" 통과했다는
            뜻입니다. 이번 변경으로 생긴 분기에 테스트가 없다면 그건 여전히
            <review_dimensions> 7번의 지적 대상입니다.
            </ci_results>

            <mode_selection>
            변경된 파일 목록을 보고 아래 모드를 고르세요. 여러 모드가 해당되면
            모두 수행하고 코멘트를 섹션으로 나눕니다.

            - PR LABELS에 deps-major → [의존성 모드]만 수행
            - 블로그 글 파일(.md / .mdx)이 포함 → [글 리뷰 모드]
            - 소스 파일이 포함 → [코드 리뷰 모드]

            README, CHANGELOG, 설정 문서는 글 리뷰 대상이 아닙니다.
            발행되는 블로그 본문만 해당합니다.
            </mode_selection>

            ────────────────────────────────────────
            [의존성 모드]
            ────────────────────────────────────────
            lockfile diff를 줄줄이 읽지 마세요. 대신:
            1. 어떤 패키지가 어느 버전에서 어느 버전으로 올라가는지 정리
            2. 해당 메이저 버전의 breaking change 확인
               (필요하면 `gh search`나 릴리스 노트 활용)
            3. 각 breaking change에 대해 이 저장소가 그 API를 실제로 쓰는지
               Grep으로 대조 — 쓰는 곳이 있으면 파일:라인과 함께 지적
            4. peer dependency 충돌, 최소 Node/브라우저 요구사항 변화,
               번들 사이즈 영향 확인
            영향받는 코드가 없으면 "확인한 breaking change 목록 + 해당 없음"으로
            짧게 마무리하세요. 억지로 지적을 만들지 마세요.

            ────────────────────────────────────────
            [코드 리뷰 모드]
            ────────────────────────────────────────
            <scope>
            변경된 모든 파일, 모든 컴포넌트, 모든 함수를 검토하세요.
            첫 번째 파일이나 가장 큰 파일만이 아니라 전부입니다.
            변경된 라인뿐 아니라 그 변경이 영향을 주는 호출부와 주변 코드도 확인하세요.
            저장소에 CLAUDE.md가 있으면 먼저 읽고, 거기 명시된 컨벤션 위반을
            일반 이슈와 동일한 기준으로 지적하세요.
            </scope>

            <finding_policy>
            조사 단계에서는 발견한 모든 문제를 빠짐없이 기록하세요.
            확신이 없거나 심각도가 낮아 보이는 것도 일단 전부 포함합니다.
            "중요한 것만", "보수적으로" 같은 자체 기준으로 조사 단계에서
            걸러내지 마세요. 필터링은 <reporting_bar>에서만 적용합니다.
            </finding_policy>

            <review_dimensions>
            아래 각 항목을 순서대로, 빠짐없이 점검하세요.

            1. 정확성 / 상태
               - stale closure, 오래된 state 참조, 의존성 배열 누락 또는 과다
               - race condition: 취소되지 않는 fetch, 언마운트 후 setState,
                 순서가 보장되지 않는 비동기 처리
               - 파생 가능한 값을 별도 state로 중복 보관, 단일 진실 공급원 위반
               - key prop 오용(index key, 불안정한 key), 리스트 재정렬 시 상태 꼬임
               - 에러 / 로딩 / 빈 상태 미처리

            2. 접근성
               - 시맨틱 엘리먼트 대신 div/span에 onClick만 붙인 경우
               - 키보드 조작 불가, 모달·드로어의 포커스 트랩 및 포커스 복귀 누락
               - label 없는 폼 컨트롤, alt 없는 이미지, 잘못된 aria-* 사용
               - 색상만으로 정보 전달, 대비 부족
               - 라이브 리전 없이 갱신되는 동적 콘텐츠

            3. 성능
               - 불필요한 리렌더(인라인 객체/함수 prop, 메모되지 않은 context value)
               - 큰 동기 연산이 렌더 경로에 존재, 긴 리스트 가상화 부재
               - 레이아웃 스래싱, 애니메이션에 layout 유발 속성 사용
               - 이미지 크기/포맷/lazy loading, 폰트 로딩 전략
               - 번들에 들어가면 안 되는 임포트, 서버 전용 코드의 클라이언트 유입

            4. 보안
               - dangerouslySetInnerHTML / v-html에 미검증 입력
               - href·src에 사용자 입력이 직접 들어가는 경우(javascript: 스킴 포함)
               - target="_blank"에 rel 누락
               - 클라이언트 번들에 노출되는 시크릿, 토큰을 localStorage에 보관
               - 클라이언트 검증만 존재하고 서버 검증 가정이 없는 경우

            5. 레이아웃 / 반응형
               - 하드코딩된 픽셀 폭, 오버플로우, 작은 화면에서 깨지는 구조
               - 긴 텍스트·긴 단어·다국어 문자열에서의 파손
               - 터치 타겟 크기, safe-area 미고려

            6. 타입 / 계약
               - any, 불필요한 as 단언, 옵셔널 체이닝으로 가려진 타입 오류
               - API 응답 형태에 대한 근거 없는 가정, null/undefined 처리 누락
               - prop 인터페이스와 실제 사용의 불일치

            7. 테스트
               - 이번 변경으로 새로 생긴 분기 중 테스트가 없는 것
               - 구현 세부에 결합되어 리팩터링에 취약한 테스트
            </review_dimensions>

            <reporting_bar>
            보고 기준은 정성적 표현이 아니라 아래 구체적 기준으로 판단하세요.

            반드시 보고: 잘못된 동작, 데이터 손실, 보안 취약점, 테스트 실패,
            사용자를 오해시키는 결과, 접근성 차단 요소를 유발할 수 있는 모든 것.
            확신도가 낮아도 보고하되 확신도를 함께 적으세요.

            접어서 보고: 견고성 부족, 잠재적 문제, 컨벤션 위반.

            생략: 순수 스타일·네이밍 취향, 포매터가 처리하는 사항.
            </reporting_bar>

            ────────────────────────────────────────
            [글 리뷰 모드]
            ────────────────────────────────────────
            <writing_scope>
            변경된 모든 글 파일을 처음부터 끝까지 읽으세요. 발췌 판단 금지입니다.
            기존 글 2-3개를 Glob/Read로 함께 읽어 이 블로그의 문체·용어·구조
            관례를 파악한 뒤, 새 글이 그 관례에서 벗어나는 지점을 판단 근거로
            삼으세요. CLAUDE.md나 스타일 가이드 파일이 있으면 그것이 우선합니다.
            </writing_scope>

            <writing_criteria>
            아래가 이 저장소의 글 기준입니다. 취향이 아니라 이 기준으로만 판정하세요.
            각 항목은 "충족 / 미달"로 판정 가능해야 하며, 미달이면 근거가 되는
            문장을 인용하세요.

            1. 논지
               - 글 전체의 주장을 한 문장으로 요약할 수 있어야 한다.
                 요약을 시도해 보고 불가능하면 그 자체를 지적하세요.
               - 제목에서 대상 독자나 독자가 얻을 이점이 드러나야 한다.
                 키워드 나열에 그치는 제목은 미달.
               - 도입부에서 독자가 계속 읽을 이유를 얻어야 한다.
                 독자가 공감할 수 있는 구체적 상황·경험·문제 제기로
                 시작하는 것이 기준이며, 배경 설명만으로 시작하는 글은 미달.
               - 모든 H2 섹션은 논지에 기여해야 한다. 삭제해도 논지가
                 흔들리지 않는 섹션은 삭제 후보로 지적.
               - 결론은 앞에서 다루지 않은 새 주장을 꺼내지 않는다.

            2. 근거
               - 수치·날짜·버전·벤치마크에는 출처가 있어야 한다.
               - "훨씬 빠르다", "대부분의 경우" 같은 단정에는 측정값이나
                 조건이 붙어야 한다.
               - 링크는 형식이 유효하고 앵커 텍스트가 목적지를 설명해야 한다
                 ("여기", "이 글" 금지).
               - 저장소나 라이브러리 동작을 설명하는 문장은 실제 코드와
                 대조하세요. Grep으로 확인 가능한 것은 확인하고 판정하세요.

            3. 코드 예제
               - 복사해서 그대로 실행 가능해야 한다. 임포트 누락, 정의되지 않은
                 변수, 잘린 코드는 미달.
               - 저장소의 실제 API·버전과 일치해야 한다. 버전에 따라
                 동작이 달라지는 API를 다루면 기준 버전을 본문에
                 명시해야 한다 (React 19+, Node 24+ 등).
               - 예제가 안티패턴을 무심코 가르치면 안 된다
                 (에러 처리 생략, any, 하드코딩된 키, 검증 없는 입력).
                 지면상 생략했다면 생략했다고 주석으로 밝혀야 한다.
               - 모든 코드블록에 언어 태그가 있어야 한다.
               - 한 코드블록이 15줄을 크게 넘으면 핵심만 남기고 나누거나
                 생략 주석으로 줄일 후보로 지적.

            4. 독자
               - 대상 독자가 도입부에서 드러나거나 추론 가능해야 한다.
               - 설명 없이 처음 등장하는 용어·약어는 미달.
               - 대상 독자가 이미 아는 내용을 여러 문단에 걸쳐 설명하는
                 구간은 축약 후보로 지적.
               - 사전 지식이나 환경 요구사항이 있으면 앞부분에 명시해야 한다.

            5. 문장
               - 한 문장이 3줄을 넘으면 분리 후보.
               - 한 단락이 4문장을 넘으면 분리 후보.
               - 능동태가 기본. 불필요한 피동은 번역투 항목과 함께 지적.
               - 번역투: 불필요한 피동, "~에 대한", "~를 통해",
                 "~하는 것을 통해", "~을 가지다", "~되어지다".
               - 동일 개념의 표기가 글 안에서 흔들리면 안 된다
                 (예: 컴포넌트/component, 프론트엔드/프런트엔드).
               - 존댓말과 평서체를 섞지 않는다. 기존 글의 어체를 따른다.
               - 같은 접속 부사("그래서", "하지만")가 연속 문단 첫머리에
                 반복되면 지적.

            6. 구조 / 렌더링
               - 제목 계층을 건너뛰지 않는다(H2 다음 H4 금지).
               - 한 섹션이 새로운 핵심 개념을 3개 이상 한꺼번에 도입하면
                 분할 후보(섹션당 1-2개가 기준).
               - 이미지에 alt가 있어야 하고, 파일 경로가 실제로 존재해야 한다.
               - 표는 모바일 폭에서 읽을 수 있어야 한다. 열이 많으면 지적.
               - 전체가 불릿으로만 이루어진 섹션은 산문으로 바꿀 후보.
               - MDX라면 사용된 커스텀 컴포넌트가 실제로 존재하고 props가
                 맞는지 Grep으로 확인.

            7. 구성 흐름 / 마무리
               - 경험·문제 상황 → 원인 분석 → 해결 방안 → 얻은 이점의
                 흐름이 식별 가능해야 한다. 문제 맥락 없이 해결책만
                 나열하는 글은 미달.
               - 개선·성과를 주장하는 글이라면 구체적 수치나 비포/애프터
                 비교가 있어야 한다("빨라졌다"만으로는 미달).
               - 마무리에 독자의 다음 행동(직접 적용해볼 것, 관련 글,
                 시리즈 다음 편 예고 등)이 제시되어야 한다. 본문이
                 끝나듯 그냥 끝나는 글은 지적.

            8. 프론트매터 / 메타
               - 기존 글과 동일한 필수 필드가 모두 있어야 한다.
                 (기존 글을 읽어 필드 목록을 먼저 파악하세요.)
               - description은 검색 결과에서 잘리지 않을 길이여야 하고,
                 제목을 그대로 반복하지 않아야 한다.
               - slug가 파일 경로 규칙과 일치해야 한다.
               - 기존 글의 slug나 경로가 바뀌었다면 리다이렉트 설정이
                 함께 있어야 한다. 없으면 critical.
               - 날짜 형식과 태그 표기가 기존 글과 일치해야 한다.
            </writing_criteria>

            <writing_reporting_bar>
            반드시 보고: 사실 오류, 실행되지 않는 코드 예제, 저장소 실제 동작과
            어긋나는 설명, 깨진 링크·이미지 경로, 프론트매터 누락이나 slug 변경으로
            인한 빌드·배포·URL 파손, 논지를 한 문장으로 요약할 수 없는 구조 문제.

            접어서 보고: 문장·단락 길이, 번역투, 용어 표기 흔들림, 축약 후보
            구간, 구조상 개선 여지, 제목·도입부의 후크 부족, 구성 흐름이나
            마무리(다음 행동 제안) 미비, 코드블록 길이.

            생략: 동의어 선택, 문체 취향, 기준에 없는데 그냥 다르게 쓰고 싶은 것.
            리뷰어 개인의 글쓰기 취향을 기준인 것처럼 제시하지 마세요.
            </writing_reporting_bar>

            ────────────────────────────────────────
            <output_format>
            요약 코멘트는 PR당 하나만 유지합니다. 이 워크플로는 synchronize에도
            돌기 때문에 매번 새 코멘트를 달면 push할 때마다 리뷰가 쌓입니다.
            Write 도구로 본문을 파일(review.md)에 먼저 쓰세요. 본문에 백틱과
            따옴표가 들어가므로 `--body`로 셸에 직접 넘기지 말고 반드시
            `--body-file`을 쓰세요.

            게시 전에 `gh pr view <번호> --json comments`로 이 PR의 코멘트를 보고,
            **claude[bot]이 마지막으로 남긴 코멘트**가 무엇인지 확인하세요.

            - 그 코멘트가 이 워크플로의 리뷰(본문이 `## 리뷰 요약`으로 시작)이면
              덮어씁니다:
                gh pr comment <번호> --edit-last --create-if-none --body-file review.md
            - claude[bot] 코멘트가 아예 없으면 위 명령이 `--create-if-none`으로
              새로 만들어 주므로 그대로 쓰면 됩니다.
            - 마지막 claude[bot] 코멘트가 리뷰가 아니면(@claude 호출에 답한
              코멘트 등) `--edit-last`를 쓰지 마세요. 그걸 덮어쓰게 됩니다.
              이 경우에만 새 코멘트를 남깁니다:
                gh pr comment <번호> --body-file review.md

            덮어쓰는 경우 요약 코멘트는 항상 이번 실행 기준의 전체 상태여야
            합니다. 이전 실행에서 지적했다가 이번에 고쳐진 항목은 빼고,
            "이전 리뷰에서 언급했듯이" 같은 이전 코멘트 참조도 쓰지 마세요.

            수행한 모드의 섹션만 포함하세요.

            ## 리뷰 요약
            2-3문장. 변경의 성격과 가장 중요한 발견 하나.
            글 리뷰를 수행했다면 "이 글의 논지: ..." 를 한 문장으로 적으세요.
            요약이 불가능하면 그렇게 적으세요.

            ## 코드
            항목마다 아래 형식:

            **[심각도] 파일경로:라인 — 한 줄 제목**
            - 문제: 무엇이 잘못되었는지 (1-2문장)
            - 영향: 언제, 어떤 사용자에게, 어떤 증상으로 나타나는지
            - 제안: 구체적 수정 방향 또는 코드 스니펫
            - 확신도: high / medium / low

            ## 글
            항목마다 아래 형식:

            **[심각도] 파일경로:라인 — 기준 N. 항목명**
            - 해당 문장: (인용)
            - 문제: 어느 기준의 어느 조건에 미달하는지
            - 제안: 고친 문장 또는 구체적 방향
            - 확신도: high / medium / low

            심각도는 critical / high / medium 중 하나.

            <details>
            <summary>낮은 심각도 · 확신도 낮음 (N건)</summary>

            low 및 확신도 low 항목을 같은 형식으로 나열.

            </details>

            ## 확인했으나 문제 없음
            수행한 모드의 각 점검 카테고리 중 지적 사항이 없었던 것을
            한 줄로 나열. 카테고리를 조용히 건너뛰지 마세요.

            ### 커밋 가능한 수정 제안 (suggested changes)
            요약 코멘트를 남긴 뒤, 몇 줄 이내의 구체적 수정으로 해결되는 지적은
            GitHub suggested change로도 제안해 작성자가 UI에서 바로 커밋할 수
            있게 하세요. 글 리뷰 모드의 문장 교정도 같은 방식으로 제안합니다.

            - 대상: 이번 PR diff에 존재하는 라인(RIGHT side)만. diff 밖 라인이나
              설계 차원의 지적은 suggestion 없이 요약 코멘트로만 남기세요.
            - 기준: 확신도 high이고 대체 내용이 자명한 지적만. 취향 교정은 금지.
            - 방법: `mcp__github_inline_comment__create_inline_comment`를 지적마다
              한 번씩 호출하세요. 이 도구는 호출을 즉시 게시하지 않고 모았다가
              분류 후 한 번에 올리므로, 여러 번 나눠 불러도 코멘트가 흩어지지
              않습니다. `gh api ... /pulls/*/reviews`를 직접 치지 마세요.
              파라미터:
                path       — 파일 경로
                line       — 코멘트를 붙일 라인 (한 줄일 때)
                startLine  — 여러 줄을 교체할 때 범위 시작 (line이 범위 끝)
                side       — "RIGHT" (기본값)
                body       — 설명 한 줄 + suggestion 블록
            - body 형식:
              왜 바꾸는지 한 줄

              ```suggestion
              line(또는 startLine~line) 범위 전체를 대체할 내용
              ```
            - suggestion 블록 안에는 대체할 코드/문장만 넣고, 설명은 블록 밖에
              쓰세요. 들여쓰기는 원본 라인과 정확히 일치해야 합니다.
            - 같은 지적을 인라인과 요약 양쪽에 전부 옮겨 적지 마세요. 인라인으로
              올린 것은 요약에서는 파일:라인과 한 줄 제목까지만 남깁니다.

            어조는 건설적으로. 다만 칭찬으로 코멘트를 채우지 말고
            무엇이 왜 기준에 미달하는지에 집중하세요.
            </output_format>

            <final_output>
            코멘트를 다 남긴 뒤, 마지막 메시지로 --json-schema 스키마에 맞는
            JSON만 출력하세요. 이건 Actions 요약에 찍히는 집계용이고
            사람이 읽는 리뷰는 위의 PR 코멘트가 전부입니다. JSON에 지적
            본문을 옮겨 적지 마세요.

            - modes: 실제로 수행한 모드 ("code" / "writing" / "deps")
            - critical / high / medium / low: 요약 코멘트에 실제로 올린
              심각도별 건수. 인라인으로만 올린 것도 포함해 셉니다.
            - inline_suggestions: create_inline_comment를 호출한 횟수
            - ci_status: get_ci_status로 본 상태를 "pass" / "fail" /
              "running" / "unknown" 중 하나로
            - headline: 가장 중요한 발견 한 줄. 지적이 없으면 왜 없는지 한 줄
            </final_output>

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/sdk#command-line for available options
          # Write는 요약 코멘트 --body-file 작성용.
          #
          # 이 워크플로는 prompt가 있고 @claude 멘션이 없으므로 agent 모드로 붙는다.
          # agent 모드에서 액션은 여기 적힌 --allowed-tools를 파싱해서, 실제로
          # 나열된 MCP 서버만 설치한다. 즉 mcp__github_inline_comment__* /
          # mcp__github_ci__* 는 아래에 이름을 적어야 서버 자체가 켜진다.
          # (tag 모드는 기본으로 붙지만, 그러면 이 프롬프트가 tag 모드 기본
          #  프롬프트 뒤에 custom_instructions로 밀려들어가 출력 규약이 흔들린다)
          #
          # Bash(gh api:*)는 뺐다. 인라인 suggestion을 직접 POST할 때만 필요했는데
          # 이제 전용 MCP 도구가 그 일을 하고, gh api는 사실상 모든 write 엔드포인트를
          # 여는 와일드카드라 리뷰 전용 잡에 남겨둘 이유가 없다.
          #
          # --json-schema는 마지막 메시지를 스키마로 검증해 structured_output
          # 출력으로 내보낸다. 아래 "리뷰 결과 요약" 스텝이 이걸 Step Summary에
          # 찍는다. required를 비워 둔 것은 의도적이다 — 집계는 부수적이고,
          # 필드 하나가 빠졌다고 리뷰 잡이 실패하면 본말이 전도된다.
          claude_args: >-
            --allowed-tools
            "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --json-schema
            '{"type":"object","properties":{"modes":{"type":"array","items":{"type":"string","enum":["code","writing","deps"]}},"critical":{"type":"integer"},"high":{"type":"integer"},"medium":{"type":"integer"},"low":{"type":"integer"},"inline_suggestions":{"type":"integer"},"ci_status":{"type":"string","enum":["pass","fail","running","unknown"]},"headline":{"type":"string"}},"required":[]}'

      # structured_output은 모델이 만든 문자열이다. run 스크립트에 ${{ }}로
      # 직접 박으면 셸 인젝션이 되므로 env로 넘겨 jq에 파이프한다.
      # 값이 비어 있거나(스키마 미준수) 리뷰 스텝이 실패해도 이 스텝이
      # 잡을 빨갛게 만들지 않도록 always() + 빈 값 가드를 둔다.
      - name: 리뷰 결과 요약
        if: always() && steps.claude-review.outputs.structured_output != ''
        env:
          REVIEW_RESULT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REVIEW_RESULT" | jq -e . >/dev/null 2>&1; then
            echo "structured_output이 JSON이 아니라 요약을 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$REVIEW_RESULT" | jq -r '
            "## 리뷰 집계",
            "",
            "- 모드: \(([(.modes // [])[]] | join(", ") | if . == "" then "-" else . end))",
            "- CI: \(.ci_status // "unknown")",
            "- critical \(.critical // 0) / high \(.high // 0) / medium \(.medium // 0) / low \(.low // 0)",
            "- 인라인 suggestion: \(.inline_suggestions // 0)건",
            "",
            "> \(.headline // "-")"
          ' >> "$GITHUB_STEP_SUMMARY"
