name: Deploy apex redirect to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['apps/blog/redirect/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy-redirect'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # 버전은 루트 package.json의 packageManager 필드를 단일 source of truth로 사용
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 배포 게이트. 리다이렉트 규칙은 사이트 전체의 입구라 회귀가 조용하다 —
      # 과거 파일 경로에 후행 슬래시가 붙어 sitemap.xml이 6개월간 404였다.
      - name: Test redirect rules
        run: pnpm --filter @blog/redirect test

      # packageManager·wranglerVersion에 대한 설명은 deploy-blog.yml의 같은 스텝 참고.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/blog/redirect
          packageManager: pnpm
          command: deploy
