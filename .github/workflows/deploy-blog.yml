name: Deploy Blog to GitHub Pages

env:
  BASE_PATH: '.'
  INDEX_APP_PATH: './app'
  SUBPACKAGES_PATH: './packages'

on:
  push:
    branches: [main]
    paths: ['apps/blog/**']

  # 매일 KST 09:00 (UTC 00:00) 자동 빌드 — 예약 발행(scheduled) 글 공개용
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # 버전은 루트 package.json의 packageManager 필드를 단일 source of truth로 사용
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Caching for Turborepo
        uses: rharkor/caching-for-turbo@5d14fba18e450c09393333cfd4242e8b3cb455a6 # v2.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # about 페이지 'PR 승인' 통계 — Han5991/Han5991 프로필 레포가 매일 갱신하는
      # config/summary.json(외부 OSS 머지 PR 총수)을 읽어 빌드 타임에 주입한다.
      # 조회 실패 시 빈값 → 페이지 폴백(|| '58')이 처리.
      - name: Fetch merged PR count
        id: pr_count
        run: |
          json=$(curl -fsSL https://raw.githubusercontent.com/Han5991/Han5991/main/config/summary.json || true)
          count=$(printf '%s' "$json" | jq -r '.mergedPRs // empty' 2>/dev/null || true)
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "::warning::PR count fetch 실패 — about 페이지가 폴백값을 사용합니다"; count=''; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Merged PR count: ${count:-(fallback)}"

      - name: Build blog
        run: pnpm build --filter=@blog/web --no-cache
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}
          NEXT_PUBLIC_PR_COUNT: ${{ steps.pr_count.outputs.count }}
          NODE_ENV: production

      - name: Upload to pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apps/blog/web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
