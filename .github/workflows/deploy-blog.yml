name: Deploy Blog to GitHub Pages

env:
  BASE_PATH: '.'
  INDEX_APP_PATH: './app'
  SUBPACKAGES_PATH: './packages'

on:
  push:
    branches: [main]
    paths: ['apps/blog/**']

  # 매일 KST 09:00 (UTC 00:00) 자동 빌드 — 예약 발행(scheduled) 글 공개용
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # 버전은 루트 package.json의 packageManager 필드를 단일 source of truth로 사용
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Caching for Turborepo
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # about 페이지 'PR 승인' 통계 — Han5991/Han5991 프로필 레포가 매일 갱신하는
      # config/summary.json(외부 OSS 머지 PR 총수)을 읽어 빌드 타임에 주입한다.
      # 조회 실패 시 빈값 → 페이지 폴백(|| '58')이 처리.
      - name: Fetch merged PR count
        id: pr_count
        run: |
          json=$(curl -fsSL https://raw.githubusercontent.com/Han5991/Han5991/main/config/summary.json || true)
          count=$(printf '%s' "$json" | jq -r '.mergedPRs // empty' 2>/dev/null || true)
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "::warning::PR count fetch 실패 — about 페이지가 폴백값을 사용합니다"; count=''; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Merged PR count: ${count:-(fallback)}"

      # Turbopack FileSystem Cache — next 16.3부터 build에서도 기본 on이고 캐시는
      # apps/blog/web/.next/cache 에 쌓인다. 위의 rharkor/caching-for-turbo는 turbo
      # 태스크 아티팩트 전용이고, turbo.json의 build outputs가 "!.next/cache/**" 로
      # 이 디렉터리를 명시 제외하므로 원리적으로 그쪽으로는 절대 복원되지 않는다.
      # 실제로 매 런 next가 "⚠ No build cache found" 를 찍고 Turbopack 컴파일을
      # 통째로 다시 한다(2026-08-09 런 기준 12.0s + TypeScript 7.0s).
      # https://nextjs.org/docs/app/api-reference/config/next-config-js/turbopackFileSystemCache
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/blog/web/.next/cache
          # .next/cache는 append-only가 아니라 매 빌드 갱신되므로, key 끝에 커밋 SHA를
          # 물려 커밋마다 새 엔트리를 저장하고 restore-keys로 직전 엔트리를 물려받는다.
          # restore-keys에 lockfile 해시를 반드시 남긴다 — OS만 맞추는 폴백 키를 두면
          # 의존성이 바뀐 뒤에도 옛 캐시를 물려받아 key의 해시가 무의미해진다.
          # 캐시 오염 시 아래 `-v1-` 을 `-v2-` 로 올려 통째로 버린다.
          key: blog-next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            blog-next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build blog
        run: pnpm build --filter=@blog/web --no-cache
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}
          NEXT_PUBLIC_PR_COUNT: ${{ steps.pr_count.outputs.count }}
          NODE_ENV: production

      # 캐시 복원이 net-positive인지 판정하기 위한 관측용. 다음 런에서
      # "⚠ No build cache found" 가 사라지고 "Compiled successfully in Xs" 의 X가
      # 12.0s 대비 줄어야 성공이다. 캐시가 수백 MB로 커져 전송비용이 절감분을
      # 먹으면 next.config.ts에 experimental.turbopackFileSystemCacheForBuild: false
      # 를 넣어 되돌린다(문서가 권하는 opt-out).
      - name: Report Next.js build cache size
        if: always()
        run: du -sh apps/blog/web/.next/cache 2>/dev/null || echo '(no .next/cache)'

      # /posts/ 아카이브는 사이트의 유일한 전체 목록 허브다. PostsArchiveView가
      # useSearchParams를 쓰는 탓에 프리렌더에서 빠지므로, Suspense fallback이
      # 스피너로 되돌아가면 이 페이지의 내부 링크가 조용히 0개가 된다.
      # (실제로 c206b99에서 고친 것이 15ed918 리디자인에서 유실된 적 있음)
      - name: Verify archive links are prerendered
        run: |
          html='apps/blog/web/out/posts/index.html'
          [[ -f "$html" ]] || { echo "::error::$html 이 없습니다"; exit 1; }
          count=$(grep -o 'href="/posts/[^"]*"' "$html" | sort -u | wc -l | tr -d ' ')
          echo "prerendered post links: $count"
          if (( count < 10 )); then
            echo "::error::/posts/ 에 프리렌더된 글 링크가 ${count}개뿐입니다 — CSR bail-out 회귀로 아카이브 내부 링크가 사라졌습니다"
            exit 1
          fi

      # 최종 HTML의 SEO 계약 검사 — h1 정확히 1개, description 중복/길이,
      # canonical 자기참조, og:site_name·locale·type, img alt,
      # sitemap ↔ rss ↔ llms.txt 글 집합 일치.
      # lint:posts는 frontmatter 원문만 보므로 렌더 결과의 회귀는 여기서만 잡힌다
      # (2026-08 감사에서 나온 h1 2개 · description 완전 중복이 그런 사례).
      - name: Check SEO of built pages
        working-directory: apps/blog/web
        run: npx tsx scripts/check-seo.ts

      - name: Upload to pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apps/blog/web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
