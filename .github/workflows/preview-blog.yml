name: Preview Blog on Cloudflare Workers

# PR마다 블로그를 빌드해 **버전 프리뷰 URL**로 올리고 그 주소를 PR에 코멘트한다.
# 프로덕션(deploy-blog.yml)은 건드리지 않는다 — `wrangler versions upload`는 버전만
# 만들고 트래픽을 옮기지 않으므로 blog.sangwook.dev는 그대로다.
#
# 프리뷰 URL이 나오려면 wrangler.jsonc의 `preview_urls: true`가 필요하다. 이 값의
# 기본값은 `workers_dev`를 따라가는데 우리는 그걸 false로 뒀으므로(중복 콘텐츠 차단)
# 명시적으로 켜 두었다 — 거기를 끄면 이 워크플로가 조용히 URL 없이 끝난다.
#
# **앱 둘을 매트릭스로 돌린다** — Next.js 판(`apps/blog/web`)과 SvelteKit 판
# (`apps/blog/web-svelte`). 각자 자기 Worker에 올라가므로 서로 트래픽을 건드리지
# 않고, 같은 브랜치 alias를 써도 충돌하지 않는다(Worker가 다르다). 파일을 둘로
# 나누지 않은 이유는 갈리는 것이 매트릭스 키 몇 개뿐이기 때문이다: 작업 디렉터리,
# 빌드 필터, 워커 이름, 부트스트랩 허용 여부, Next 전용 캐시, PR 코멘트의 머리말.
# 나머지(alias 정규화, URL 파싱, 포크 가드)가 둘로 갈리면 한쪽만 고쳐지는 자리가
# 된다.

on:
  pull_request:
    paths: ['apps/blog/**', 'packages/@blog/**']

concurrency:
  # 같은 PR에 push가 쌓이면 이전 프리뷰 빌드를 취소한다(마지막 것만 의미가 있다).
  group: preview-blog-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # 프리뷰 URL 코멘트

jobs:
  preview:
    # **체크 이름을 매트릭스에서 명시한다.** `name:`을 두지 않으면 GitHub이
    # 매트릭스 값을 자동으로 덧붙여(`preview (web)`) 기존 체크 이름이 바뀌는데,
    # 그 이름이 브랜치 보호의 required check라면 PR이 "Expected — waiting for
    # status"에서 영영 멈춘다. 실패가 조용해서 알아채기 어렵다 —
    # `.github/actions/quality-checks/action.yml`이 composite action인 이유가
    # 정확히 같은 함정이다. Next.js 판은 예전 이름(`preview`)을 그대로 쓴다.
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 한쪽이 실패해도 나머지 프리뷰는 나와야 한다 — 리뷰어가 볼 것이 하나라도
      # 있는 편이 낫고, 두 앱은 서로 독립이다.
      fail-fast: false
      matrix:
        include:
          - app: web
            package: '@blog/web'
            label: 'Next.js'
            check: preview
            comment: cloudflare-preview
            worker: blog
            # **프로덕션 Worker다. 부트스트랩을 절대 걸지 않는다** — 아래 참조.
            bootstrap: false
            note: >-
              프로덕션(`blog.sangwook.dev`)은 그대로입니다 — 이 단계는 버전만 올리고
              트래픽을 옮기지 않습니다. Admin 로그인은 프리뷰에서 동작하지 않을 수 있습니다.
          - app: web-svelte
            package: '@blog/web-svelte'
            label: 'SvelteKit'
            check: preview-svelte
            comment: cloudflare-preview-svelte
            worker: blog-svelte
            bootstrap: true
            note: >-
              이 앱은 **프리뷰 URL로만** 열립니다(프로덕션 도메인이 없습니다).
              Supabase는 로컬 인스턴스만 가리키므로 조회수·Admin은 동작하지 않습니다 —
              결정 원장의 항목이고 버그가 아닙니다.
    # 포크 PR에는 시크릿이 없어 빌드가 반쯤 깨진 프리뷰가 나온다. 같은 저장소의
    # 브랜치일 때만 돈다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 버전은 루트 package.json의 packageManager 필드를 단일 source of truth로 사용
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Caching for Turborepo
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Next 전용이다 — SvelteKit 쪽은 vite/rolldown이라 이 디렉터리가 없다.
      - name: Restore Next.js build cache
        if: matrix.app == 'web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/blog/web/.next/cache
          key: blog-next-preview-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            blog-next-preview-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # `environment:`를 쓰지 않는다. github-pages 환경의 배포 브랜치 정책이 main
      # 하나라 PR 브랜치에서는 잡 자체가 막힌다. 필요도 없다 — 빌드가 읽는
      # NEXT_PUBLIC_* 값은 전부 커밋된 .env.production에 있다.
      # (예전엔 이유가 하나 더 있었다: 그 환경에 GOOGLE_OAUTH_CLIENT_SECRET이
      #  같이 있어서, 환경을 열면 그것까지 모든 PR에서 읽혔다. 그 시크릿은
      #  아무도 안 쓰는 사본이라 지웠으므로 지금은 브랜치 정책만 남았다.)
      - name: Build blog
        run: pnpm build --filter=${{ matrix.package }}
        env:
          NODE_ENV: production

      # 브랜치 고정 alias. 커밋마다 바뀌는 버전 URL과 달리 리뷰 내내 같은 주소를
      # 쓸 수 있다. alias는 영숫자와 하이픈만 받으므로 정규화가 필요하다
      # (`chore/cloudflare-domain-cleanup` → `chore-cloudflare-domain-cleanup`).
      #
      # **길이 한계는 alias가 아니라 호스트 레이블에 걸린다.** 프리뷰 주소는
      # `<alias>-<워커 이름>.<서브도메인>.workers.dev`라 DNS 레이블 63자를 나눠 쓴다.
      # 그래서 63에서 워커 이름과 하이픈을 빼고 자른다 — 워커가 `blog`면 58자,
      # `blog-svelte`면 51자다. 63으로 통일해 자르면 이름이 긴 쪽에서만 레이블이
      # 넘쳐 **한 앱의 프리뷰만** 조용히 실패한다.
      - name: Compute preview alias
        id: alias
        env:
          BRANCH: ${{ github.head_ref }}
          WORKER: ${{ matrix.worker }}
        run: |
          budget=$(( 63 - ${#WORKER} - 1 ))
          alias=$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-"$budget" \
            | sed -E 's/-+$//')
          # 숫자로 시작하는 호스트 레이블도 유효하지만, 빈 값만은 막는다.
          [[ -n "$alias" ]] || alias="pr-${{ github.event.pull_request.number }}"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "alias: $alias (워커 $WORKER, 예산 ${budget}자)"

      # **`versions upload`는 이미 존재하는 Worker에만 버전을 얹는다.** 없으면
      # wrangler가 통째로 거절한다 — "You cannot upload a new version of a Worker
      # that does not yet exist. Please run the `deploy` command first." 그런데 이
      # 저장소에서 SvelteKit 판을 `deploy`하는 경로는 어디에도 없다(결정 원장:
      # 프리뷰 URL 전용). 그래서 첫 Worker는 여기서 한 번만 만든다.
      #
      # **여기서 `deploy`가 프로덕션 표면을 만들지 않는다.** 그 Worker의
      # `wrangler.jsonc`에는 `routes`가 없고 `workers_dev`도 false라, 활성 버전이
      # 생겨도 그것에 닿을 수 있는 주소가 하나도 없다. 열리는 것은 여전히
      # `preview_urls`가 내는 주소뿐이다.
      #
      # **`bootstrap: true`인 앱에만 건다.** 존재 확인은 네트워크·토큰 문제로도
      # 실패할 수 있는데, 그 오탐이 `blog`(프로덕션 Worker)에 닿으면 PR 브랜치의
      # 빌드가 `blog.sangwook.dev`로 나간다. 매트릭스 플래그로 그 경로를 아예
      # 없앤다 — 오탐이 나도 최악이 "주소 없는 Worker에 deploy 한 번"이다.
      - name: Check whether the Worker exists
        id: worker
        if: matrix.bootstrap
        working-directory: apps/blog/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if pnpm exec wrangler versions list >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.worker }}: 이미 있음 — 부트스트랩 건너뜀"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.worker }}: 없음 — deploy로 한 번 만든다"
          fi

      - name: Bootstrap the Worker (first run only)
        if: matrix.bootstrap && steps.worker.outputs.exists == 'false'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/blog/${{ matrix.app }}
          packageManager: pnpm
          command: deploy

      # 버전만 업로드한다(트래픽 이동 없음). 버전 URL과 alias URL이 stdout에 찍힌다.
      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          # accountId는 넘기지 않는다 — wrangler.jsonc의 account_id가 단일 출처다.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/blog/${{ matrix.app }}
          packageManager: pnpm
          command: versions upload --preview-alias "${{ steps.alias.outputs.alias }}" --message "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

      # wrangler가 찍는 workers.dev URL 둘을 갈라 담는다. alias를 포함한 쪽이 브랜치
      # 고정 URL, 나머지가 이번 커밋의 버전 URL이다. wrangler-action의 deployment-url
      # 출력은 versions upload에서 비는 경우가 있어 stdout 파싱을 1차로 쓴다.
      - name: Resolve preview URLs
        id: url
        env:
          ALIAS: ${{ steps.alias.outputs.alias }}
          ACTION_URL: ${{ steps.upload.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          mapfile -t urls < <(printf '%s' "$COMMAND_OUTPUT" \
            | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | sort -u || true)
          alias_url=""
          version_url=""
          for u in "${urls[@]}"; do
            if [[ "$u" == "https://${ALIAS}-"* ]]; then
              alias_url="$u"
            elif [[ -z "$version_url" ]]; then
              version_url="$u"
            else
              # 버전 URL 후보가 둘 이상이면 wrangler 출력 포맷이 바뀐 것이다.
              # 조용히 덮어쓰면 엉뚱한 주소가 PR 코멘트에 올라간다.
              echo "::warning::예상 밖의 workers.dev URL: $u (첫 번째 $version_url 를 유지)"
            fi
          done
          [[ -n "$version_url" ]] || version_url="$ACTION_URL"
          if [[ -z "$version_url" && -z "$alias_url" ]]; then
            echo "::warning::프리뷰 URL을 찾지 못했습니다 — wrangler.jsonc의 preview_urls가 꺼져 있는지 확인하세요"
          fi
          echo "version_url=$version_url" >> "$GITHUB_OUTPUT"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "version: ${version_url:-(none)}"
          echo "alias:   ${alias_url:-(none)}"

      - name: Comment preview URL on PR
        if: steps.url.outputs.version_url != '' || steps.url.outputs.alias_url != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment }}
          message: |
            ### 🔍 Cloudflare 프리뷰 — ${{ matrix.label }}

            | | |
            | :-- | :-- |
            | **브랜치 프리뷰** (고정) | ${{ steps.url.outputs.alias_url }} |
            | 이 커밋 | ${{ steps.url.outputs.version_url }} |
            | 커밋 SHA | `${{ github.event.pull_request.head.sha }}` |

            브랜치 프리뷰 주소는 커밋마다 바뀌지 않으니 리뷰 내내 그대로 쓰시면 됩니다.

            ${{ matrix.note }}
