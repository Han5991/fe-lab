packages:
  - 'apps/**/*'
  - 'packages/**/*'

overrides:
  # next(8.4.31 고정)와 @pandacss/*(8.5.14 고정)가 각자 exact 핀을 걸어서, 오버라이드를
  # 빼면 postcss가 8.4.31/8.5.14/8.5.18 세 벌로 갈라진다. 한 벌로 dedupe하기 위해 유지.
  postcss: 8.5.18
  # GHSA-f88m-g3jw-g9cj(high)가 0.35.0에서만 패치됐는데 next가 ^0.34.5로 optional 핀.
  # next가 0.35 라인을 허용하면 제거할 것. 블로그는 unoptimized라 sharp 미사용.
  sharp: 0.35.3

auditConfig:
  ignoreGhsas:
    # brace-expansion ReDoS. 패치가 5.0.8뿐이고 1.x 백포트가 없다. eslint→minimatch@3이
    # ^1.1.7을 고정하는데 v2+는 CJS export가 바뀌어 강제 승격 불가(함수→named export).
    # 1.x 백포트(1.1.17+)가 나오면 이 ignore를 지우고 lockfile 재해석으로 반영할 것.
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  lefthook: true
  msw: false

catalog:
  '@pandacss/dev': 1.11.4
  'next': 16.2.11
  typescript: 6.0.3
  react: 19.2.7
  react-dom: 19.2.7
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
