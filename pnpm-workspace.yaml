packages:
  - 'apps/**/*'
  - 'packages/**/*'

overrides:
  # next(8.4.31 고정)와 @pandacss/*(8.5.14 고정)가 각자 exact 핀을 걸어서, 오버라이드를
  # 빼면 postcss가 8.4.31/8.5.14/8.5.18 세 벌로 갈라진다. 한 벌로 dedupe하기 위해 유지.
  postcss: 8.5.26
  # @pandacss/core(및 형제 패키지) 1.12.0/1.12.1이 browserslist를 4.28.1로 exact 핀
  # 고정해 pnpm audit이 GHSA-c83g-rgw3-j3cx·GHSA-73wf-gq98-2v4g(무제한 메모리 증가 ·
  # prototype write 크래시, 둘 다 high)를 report한다. 패치 버전(4.28.7+)이 나와도
  # 핀이 그대로라 in-range 승급이 불가능해 permanent override로 고정. 이미 다른
  # 의존자(babel-helper-compilation-targets 등)가 4.28.8을 쓰고 있어 dedupe도 겸한다.
  # 제거 조건: @pandacss/core가 4.28.7+로 핀을 올리면 삭제.
  browserslist: 4.28.8
  # 같은 @pandacss/core가 postcss-selector-parser도 7.1.1로 exact 핀 고정해
  # GHSA-w9m9-85wc-3x92(uncontrolled AST recursion DoS, low)를 report한다. 패치는
  # 7.1.3+. 같은 이유로 in-range 승급 불가 → permanent override.
  # 제거 조건: @pandacss/core가 7.1.3+로 핀을 올리면 삭제.
  postcss-selector-parser: 7.1.6

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  lefthook: true
  msw: false
  # unrs-resolver(eslint-import-resolver-typescript 경유)의 postinstall은
  # 플랫폼 네이티브 바이너리 폴백 체크다. 바이너리는 optionalDependencies로
  # 이미 설치되므로 스크립트 없이도 동작한다 - 공급망 보수 원칙대로 거부.
  unrs-resolver: false

# 두 개 이상의 워크스페이스 패키지가 쓰는 버전은 전부 여기로 올린다. 패키지의
# package.json에는 'catalog:'(기본) 또는 'catalog:lint'(아래 named catalog)만 적고,
# 숫자는 이 파일에만 존재한다 — 한 곳을 올리면 저장소 전체가 같이 움직인다.
catalog:
  # 프레임워크 · 언어
  '@pandacss/dev': 1.12.0
  'next': 16.3.0
  typescript: 6.0.3
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@types/node': ^24.13.3

  # 런타임 라이브러리
  '@tanstack/react-query': ^5.101.4
  pretendard: ^1.3.9
  react-markdown: ^10.1.0
  rehype-raw: ^7.0.0
  remark-gfm: ^4.0.1

  # 빌드 · 실행 도구
  commander: ^15.0.0
  tsdown: 0.22.14

  # 테스트
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  jsdom: ^30.0.1
  msw: ^2.15.0
  '@vitejs/plugin-react': ^6.0.5
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.6

# lint 툴체인은 서로 버전이 맞물려 돌아간다(eslint 코어 ↔ @eslint/js ↔ typescript-eslint,
# next ↔ eslint-config-next). 한 벌로 움직여야 하므로 named catalog로 떼어 둔다.
# 소비자가 하나뿐인 플러그인도 여기 둔다 — 툴체인 버전 표가 여러 곳으로 흩어지지 않게.
catalogs:
  lint:
    eslint: ^10.9.1
    '@eslint/js': ^10.0.1
    '@eslint-community/eslint-plugin-eslint-comments': ^4.7.2
    '@next/eslint-plugin-next': ^16.3.0
    eslint-config-next: 16.3.0
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-boundaries: ^7.2.0
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.5
    # ESLint가 TypeScript 설정 파일(eslint.config.mts)을 읽을 때 쓰는 런타임
    # 로더. 빌드 스텝 없이 그 자리에서 트랜스파일한다 — 10.8의 TS 설정 지원이
    # jiti >=2.2를 요구한다(lib/config/config-loader.js).
    jiti: ^2.7.0
    globals: ^17.9.0
    typescript-eslint: ^8.67.0
