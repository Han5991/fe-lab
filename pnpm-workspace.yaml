packages:
  - 'apps/**/*'
  - 'packages/**/*'

overrides:
  # next(8.4.31 고정)와 @pandacss/*(8.5.14 고정)가 각자 exact 핀을 걸어서, 오버라이드를
  # 빼면 postcss가 8.4.31/8.5.14/8.5.18 세 벌로 갈라진다. 한 벌로 dedupe하기 위해 유지.
  postcss: 8.5.26

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  lefthook: true
  msw: false

catalog:
  '@pandacss/dev': 1.12.0
  'next': 16.3.0
  typescript: 6.0.3
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
