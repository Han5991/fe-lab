# 패키지가 실제로 있는 깊이만 적는다. 예전의 'apps/**/*'·'packages/**/*'는 산출물 안의
# package.json(minibundler가 쓰는 sample-lib/dist/package.json)까지 importer로 잡아 frozen
# install을 깨뜨렸고, 그래서 '!**/dist/**' 예외가 붙어 있었다.
packages:
  - 'apps/*'
  - 'apps/blog/*'
  - 'packages/*/*'

overrides:
  # next가 postcss를 8.4.31로 exact 핀 고정해서, 오버라이드를 빼면 postcss가 next용 한 벌과
  # 나머지(Panda v2의 @pandacss/postcss는 peer `>=8`) 한 벌로 갈라진다. 한 벌로 dedupe하기 위해 유지.
  # (예전엔 @pandacss/core 1.x의 8.5.14 exact 핀도 이유였다 — v2에서 @pandacss/core가 없어졌다.)
  postcss: 8.5.28
  # satori 0.33.4가 fflate를 0.7.3으로 exact 핀 고정해 GHSA(medium, unzipSync가
  # 손상된 ZIP64 아카이브에서 무한 루프)를 report한다. 패치는 0.7.5+.
  # 형제 의존자 @shuding/opentype.js는 ^0.7.3이라 승급 가능하지만, satori의 exact 핀
  # 때문에 lock file maintenance가 두 벌을 취약한 0.7.3 한 벌로 dedupe해 버린다.
  # 제거 조건: satori가 0.7.5+로 핀을 올리면 삭제.
  fflate: 0.8.3
  # miniflare(wrangler 경유)가 undici를 7.29.1로 exact 핀 고정해 GHSA-4qv8-2p9j-2685
  # (moderate, EventSource 무제한 메모리 DoS)·GHSA-f72v-6w45-q472(moderate, 대문자 알고리즘
  # 이름으로 SRI 우회)를 report한다. 패치는 7.30.1(최신 5.x 베타 5.20261019.2-beta도
  # 같은 핀, 2026-10-24 확인). jsdom의 undici는 8.x(^8.10.2)라 전역 override로 묶으면
  # 메이저가 섞이므로 miniflare 아래만 고친다. 제거 조건: miniflare가 핀을 7.30.1+로 올리면 삭제.
  'miniflare>undici': 7.30.1

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  lefthook: true
  msw: false
  # unrs-resolver(eslint-import-resolver-typescript 경유)의 postinstall은
  # 플랫폼 네이티브 바이너리 폴백 체크다. 바이너리는 optionalDependencies로
  # 이미 설치되므로 스크립트 없이도 동작한다 - 공급망 보수 원칙대로 거부.
  unrs-resolver: false
  # workerd(wrangler 경유)의 postinstall은 unrs-resolver와 같은 esbuild식 설치
  # 스크립트다 — 플랫폼 바이너리를 찾지 못하면 https로 **직접 내려받는다**.
  # 바이너리는 optionalDependencies(@cloudflare/workerd-*)로 이미 설치되므로
  # 스크립트 없이도 동작하고, CI가 부르는 `wrangler deploy`는 workerd 자체를
  # 쓰지 않는다(로컬 `wrangler dev`만 쓴다). 같은 원칙으로 거부.
  workerd: false
  # @parcel/watcher(@pandacss/cli 2.x 경유 — panda --watch)의 install 스크립트는
  # npm_config_build_from_source=true일 때만 node-gyp로 소스 빌드한다. 평소엔 아무것도
  # 하지 않고, 바이너리는 optionalDependencies(@parcel/watcher-<플랫폼>)로 이미 설치된다.
  # 같은 원칙으로 거부.
  '@parcel/watcher': false

# 두 개 이상의 워크스페이스 패키지가 쓰는 버전은 전부 여기로 올린다. 패키지의
# package.json에는 'catalog:'(기본) 또는 'catalog:lint'(아래 named catalog)만 적고,
# 숫자는 이 파일에만 존재한다 — 한 곳을 올리면 저장소 전체가 같이 움직인다.
# 소비자가 하나뿐인 항목은 한 번호로 함께 움직이는 묶음(@pandacss/*, next 릴리스 트레인,
# 아래 '# 테스트' 툴체인, catalogs.lint)에 속할 때만 둔다. 그 밖의 단일 소비자 의존성은
# 그 패키지의 package.json에 숫자로 적고, 두 번째 소비자가 생기면 여기로 올린다.
catalog:
  # 프레임워크 · 언어
  # @pandacss/*는 한 버전으로만 움직인다(Panda v2 문서 "All @pandacss/* packages move on one
  # version. Don't mix") — 함께 올린다. catalogs.lint의 @pandacss/eslint-plugin도 같은 번호.
  '@pandacss/dev': 2.3.0
  '@pandacss/preset-base': 2.3.0
  '@pandacss/preset-panda': 2.3.0
  '@pandacss/vite': 2.3.0
  # next와 같은 릴리스 트레인(@next/third-parties, catalogs.lint의 @next/eslint-plugin-next·
  # eslint-config-next)은 next처럼 정확한 번호로 함께 올린다. 캐럿으로 두면 범위 안 최신 패치로
  # 풀려 다시 어긋나고, eslint-config-next가 고정한 플러그인과 두 벌이 된다. 어긋나도 아무 검사도
  # 실패하지 않는다 — 동반 패키지의 peer가 next를 ^13~^16으로 넓게 받는다. Renovate 보안 PR은
  # 취약한 next 하나만 올리고 자동 머지되므로(#523·#558) 동반 패키지가 한 마이너 뒤처진 채 남았었다.
  'next': 16.4.1
  '@next/third-parties': 16.4.1
  typescript: 6.0.3
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': ^26.6.6

  # 런타임 라이브러리
  '@tanstack/react-query': ^5.103.2
  pretendard: ^1.3.9

  # 빌드 · 실행 도구
  # 루트(format·lefthook)와 @blog/web(gen:types)이 함께 쓴다
  prettier: ^3.9.9

  # 테스트
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  jsdom: ^30.1.1
  msw: ^2.15.0
  '@vitejs/plugin-react': ^6.1.1
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7

# lint 툴체인은 서로 버전이 맞물려 돌아간다(eslint 코어 ↔ @eslint/js ↔ typescript-eslint,
# next ↔ eslint-config-next — 위 catalog의 next 주석). 한 벌로 움직여야 하므로 named catalog로 떼어 둔다.
# 소비자가 하나뿐인 플러그인도 여기 둔다 — 툴체인 버전 표가 여러 곳으로 흩어지지 않게.
catalogs:
  lint:
    eslint: ^10.11.0
    '@eslint/js': ^10.0.1
    '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
    '@next/eslint-plugin-next': 16.4.1
    eslint-config-next: 16.4.1
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-boundaries: ^7.2.0
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.7
    # ESLint가 TypeScript 설정 파일(eslint.config.mts)을 읽을 때 쓰는 런타임
    # 로더. 빌드 스텝 없이 그 자리에서 트랜스파일한다 — 10.8의 TS 설정 지원이
    # jiti >=2.2를 요구한다(lib/config/config-loader.js).
    jiti: ^2.7.0
    globals: ^17.12.0
    typescript-eslint: ^8.70.1
    # Panda 공식 lint 플러그인. @pandacss/compiler를 exact로 고정해서 기본 catalog의
    # @pandacss/dev와 같은 번호로만 움직인다(eslint-config-next ↔ next와 같은 관계).
    '@pandacss/eslint-plugin': 2.3.0
